# Build -> Push -> Deploy for Cloud Run.
# The deploy step updates the running service with the freshly built image.
steps:
  # 1) Build the container image, tagged with this commit's SHA
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ghsl-app:$COMMIT_SHA'
      - '.'

  # 2) Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/ghsl-app:$COMMIT_SHA'

  # 3) Deploy that exact image to Cloud Run.
  #    We only set --image and --region here, so the service keeps whatever
  #    CPU / memory / scaling you already configured in the Cloud Run console.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ghsl-app'
      - '--image=gcr.io/$PROJECT_ID/ghsl-app:$COMMIT_SHA'
      - '--region=asia-south1'

images:
  - 'gcr.io/$PROJECT_ID/ghsl-app:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
